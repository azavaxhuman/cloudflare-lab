<!doctype html>
<html lang="fa">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Cloudflare Lab: interactive 3D simulator of how Cloudflare maps visitor HTTP/HTTPS ports to the origin server, calibrated with live tests.">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:14px}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Cloudflare Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Vazirmatn:wght@400;600;800&display=swap">
<style>
:root{
  --bg:#0d1220;
  --panel:#141b2d;
  --raise:#1b2439;
  --line:#28334e;
  --fg:#e8ecf4;
  --muted:#8e98b0;
  --amber:#f6a23c;
  --on-amber:#1d1204;
  --http:#ff6b6b;
  --https:#3fe0a5;
  --ok:#7cc7ff;
  --warn:#ffcc4d;
  --fail:#ff3b5c;
  --hud:rgba(13,18,32,.82);
  --display:"Vazirmatn",Tahoma,system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:dark;
}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--display);font-size:14px;line-height:1.6}
.app{height:100%;box-sizing:border-box;display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:16px;padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app[dir="ltr"]{grid-template-columns:400px minmax(0,1fr)}
.app[dir="ltr"] .panel{order:-1}
.stage{position:relative;min-height:0;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--bg)}
#scene{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
#scene:active{cursor:grabbing}
.hud{position:absolute;top:12px;left:12px;right:12px;display:flex;flex-wrap:wrap;gap:8px;align-items:flex-start;pointer-events:none}
.chip{background:var(--hud);border:1px solid var(--line);border-radius:10px;padding:6px 10px;font-family:var(--mono);font-size:clamp(11px,1.25vw,14px);font-weight:700;backdrop-filter:blur(6px)}
.flow{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.flow .sep{color:var(--muted);font-weight:500}
.flow .hopsep{color:var(--warn)}
.nav-views{position:absolute;left:12px;bottom:12px;display:flex;flex-wrap:wrap;gap:6px;max-width:calc(100% - 150px)}
.nav-views button{font-size:12px;padding:5px 10px;background:var(--hud);backdrop-filter:blur(6px)}
.nav-views button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--on-amber);font-weight:600}
.dpad{position:absolute;right:12px;bottom:12px;display:grid;grid-template-columns:repeat(3,34px);grid-template-rows:repeat(3,34px);gap:4px}
.dp{padding:0;width:34px;height:34px;display:grid;place-items:center;background:var(--hud);backdrop-filter:blur(6px);font-family:var(--mono);font-size:14px;line-height:1;touch-action:none;user-select:none;-webkit-user-select:none}
.dp.zin{grid-area:1/1}.dp.up{grid-area:1/2}.dp.left{grid-area:2/1}.dp.home{grid-area:2/2}.dp.right{grid-area:2/3}.dp.zout{grid-area:3/1}.dp.down{grid-area:3/2}
.nogl{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;color:var(--muted)}
.panel{min-height:0;overflow-y:auto;display:flex;flex-direction:column;gap:18px;padding-inline:2px 6px}
.head{display:flex;flex-direction:column;gap:6px}
.head-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.head h1{font-size:22px;font-weight:800;margin:0;line-height:1.35;text-wrap:balance}
.head p{margin:0;color:var(--muted);max-width:62ch}
.group{display:flex;flex-direction:column;gap:8px}
.group h2{font-size:13px;font-weight:600;color:var(--muted);margin:0}
.seg{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer;transition:background .15s,border-color .15s}
button:hover:not(:disabled){border-color:var(--muted)}
button:focus-visible,.switch input:focus-visible+.track{outline:2px solid var(--amber);outline-offset:2px}
button:disabled{opacity:.35;cursor:not-allowed}
.seg button{font-family:var(--mono);font-size:12.5px;font-weight:500}
#req-custom{font-family:var(--display)}
.seg button[aria-pressed="true"]{background:var(--amber);border-color:var(--amber);color:var(--on-amber);font-weight:700}
.seg.dim button[aria-pressed="true"]{background:var(--raise);color:var(--muted);border-color:var(--muted)}
.lang button{font-family:var(--display);font-size:12.5px;padding:4px 10px}
.note{font-size:12px;color:var(--warn);margin:0}
.custom{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.custom-l{font-size:12px;color:var(--muted)}
.custom input{width:7em;font-family:var(--mono);font-size:13px;font-weight:700;color:var(--fg);background:var(--raise);border:1px solid var(--line);border-radius:8px;padding:6px 8px;direction:ltr}
.custom input:focus-visible{outline:2px solid var(--amber);outline-offset:2px}
.switches{display:flex;flex-direction:column;gap:10px}
.switch{display:flex;align-items:center;gap:10px;cursor:pointer;user-select:none}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.track{flex:none;width:38px;height:22px;border-radius:11px;background:var(--raise);border:1px solid var(--line);position:relative;transition:background .15s}
.track::after{content:"";position:absolute;top:2px;inset-inline-start:2px;width:16px;height:16px;border-radius:50%;background:var(--muted);transition:transform .15s,background .15s}
.switch input:checked+.track{background:var(--amber);border-color:var(--amber)}
.switch input:checked+.track::after{transform:translateX(16px);background:var(--on-amber)}
[dir="rtl"] .switch input:checked+.track::after{transform:translateX(-16px)}
.switch input:disabled+.track{opacity:.35}
.switch input:disabled~.lbl{opacity:.5}
.switch .lbl{display:flex;flex-direction:column;line-height:1.35}
.switch .lbl small{color:var(--muted);font-size:12px}
.switch.big .lbl>span{font-weight:600}
.readout{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.leg{display:grid;grid-template-columns:7.5em 1fr;gap:4px 10px;align-items:center}
.leg .name{font-size:12px;color:var(--muted)}
.leg .val{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.badge{font-family:var(--mono);font-size:13px;font-weight:700;border-radius:6px;padding:2px 8px;border:1px solid currentColor;direction:ltr;unicode-bidi:isolate}
.tag{font-size:12px;color:var(--muted)}
.status{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:10px}
.status .code{font-family:var(--mono);font-size:32px;font-weight:700;line-height:1;direction:ltr}
.status .ttl{font-family:var(--mono);font-size:13px;color:var(--muted);direction:ltr;overflow-wrap:anywhere}
.explain{display:flex;flex-direction:column;gap:6px}
.explain p{margin:0;max-width:62ch}
.callout{border:1px dashed var(--warn);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.callout strong{color:var(--warn);font-size:13px}
.callout p{margin:0;font-size:13px}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;counter-reset:st}
.steps li{counter-increment:st;display:grid;grid-template-columns:24px 1fr;gap:8px;align-items:start;font-size:13px;color:var(--muted);transition:color .2s}
.steps li::before{content:counter(st);font-family:var(--mono);font-size:11px;font-weight:700;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--raise)}
.steps li.done{color:var(--fg)}
.steps li.done::before{background:var(--line)}
.steps li.active{color:var(--fg);font-weight:600}
.steps li.active::before{background:var(--amber);border-color:var(--amber);color:var(--on-amber)}
.steps li.k-redirect.done::before,.steps li.k-redirect.active::before{background:var(--warn);border-color:var(--warn);color:var(--on-amber)}
.steps li.k-fail.done::before,.steps li.k-fail.active::before{background:var(--fail);border-color:var(--fail);color:var(--fg)}
.steps li span{min-width:0;overflow-wrap:anywhere}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:11px;height:11px;display:inline-block;flex:none}
.sw.dot{border-radius:50%}
.sw.ring{border-radius:50%;box-shadow:0 0 0 2px var(--bg),0 0 0 3.5px var(--https)}
.sw.env{border-radius:2px;width:14px;height:9px}
.keys{font-size:12px;color:var(--muted);margin:0}
kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;background:var(--raise)}
.c-http{color:var(--http)}
.c-https{color:var(--https)}
.c-ok{color:var(--ok)}
.c-warn{color:var(--warn)}
.c-fail{color:var(--fail)}
.c-amber{color:var(--amber)}
.c-muted{color:var(--muted)}
.bg-http{background:var(--http)}
.bg-https{background:var(--https)}
.bg-ok{background:var(--ok)}
.bg-warn{background:var(--warn)}
.bg-fail{background:var(--fail)}
@media (max-width:900px){
  .app,.app[dir="ltr"]{height:auto;grid-template-columns:minmax(0,1fr)}
  .app[dir="ltr"] .panel{order:0}
  .stage{height:min(62vh,560px);min-height:340px}
  .panel{overflow:visible}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="app" id="app" dir="rtl">
  <section class="stage" id="stage">
    <canvas id="scene"></canvas>
    <div class="hud" dir="ltr">
      <div class="chip flow" id="hudFlow"></div>
      <div class="chip c-amber" id="hudMode"></div>
      <div class="chip" id="hudCode"></div>
    </div>
    <div class="nav-views" id="navViews">
      <button type="button" id="nv-overview" data-view="overview"></button>
      <button type="button" id="nv-visitor" data-view="visitor"></button>
      <button type="button" id="nv-edge" data-view="edge"></button>
      <button type="button" id="nv-origin" data-view="origin"></button>
      <button type="button" id="nv-follow" aria-pressed="false"></button>
    </div>
    <div class="dpad" id="dpad" dir="ltr">
      <button type="button" class="dp zin" id="dp-zin" data-zoom="1">+</button>
      <button type="button" class="dp up" id="dp-up" data-pan="0,1">▲</button>
      <button type="button" class="dp left" id="dp-left" data-pan="-1,0">◀</button>
      <button type="button" class="dp home" id="dp-home">⌂</button>
      <button type="button" class="dp right" id="dp-right" data-pan="1,0">▶</button>
      <button type="button" class="dp zout" id="dp-zout" data-zoom="-1">−</button>
      <button type="button" class="dp down" id="dp-down" data-pan="0,-1">▼</button>
    </div>
  </section>

  <aside class="panel" id="panel">
    <div class="head">
      <div class="head-row">
        <h1 id="t-title"></h1>
        <div class="seg lang" id="langSeg">
          <button type="button" id="lang-fa" lang="fa">فارسی</button>
          <button type="button" id="lang-en" lang="en">English</button>
        </div>
      </div>
      <p id="t-lead"></p>
    </div>

    <div class="group">
      <h2 id="t-h-proxy"></h2>
      <label class="switch big"><input type="checkbox" id="optProxy" checked><span class="track"></span><span class="lbl"><span id="t-sw-proxy"></span><small id="t-sw-proxy-s"></small></span></label>
    </div>

    <div class="group">
      <h2 id="t-h-mode"></h2>
      <div class="seg" id="modeSeg" dir="ltr"></div>
      <p class="note" id="modeNote" hidden></p>
    </div>

    <div class="group">
      <h2 id="t-h-req"></h2>
      <div class="seg" id="reqSeg" dir="ltr"></div>
      <div class="custom">
        <span class="custom-l" id="t-custom-l"></span>
        <div class="seg" dir="ltr"><button type="button" id="cs-http">HTTP</button><button type="button" id="cs-https">HTTPS</button></div>
        <input type="number" id="customPort" min="1" max="65535" value="3000" inputmode="numeric" aria-labelledby="t-custom-l">
      </div>
      <p class="note" id="reqNote" hidden></p>
    </div>

    <div class="group">
      <h2 id="t-h-set"></h2>
      <div class="switches">
        <label class="switch"><input type="checkbox" id="optAlways"><span class="track"></span><span class="lbl"><span dir="ltr">Always Use HTTPS</span><small id="t-sw-always-s"></small></span></label>
        <label class="switch"><input type="checkbox" id="optRule"><span class="track"></span><span class="lbl"><span id="t-sw-rule"></span><small id="t-sw-rule-s"></small></span></label>
        <label class="switch"><input type="checkbox" id="optOrigin"><span class="track"></span><span class="lbl"><span id="t-sw-origin"></span><small id="t-sw-origin-s"></small></span></label>
        <label class="switch"><input type="checkbox" id="optCert" checked><span class="track"></span><span class="lbl"><span id="t-sw-cert"></span><small id="t-sw-cert-s"></small></span></label>
        <label class="switch"><input type="checkbox" id="optP80" checked><span class="track"></span><span class="lbl"><span id="t-sw-p80"></span><small id="t-sw-p80-s"></small></span></label>
      </div>
    </div>

    <div class="readout" aria-live="polite">
      <div class="leg"><span class="name" id="t-row-first"></span><span class="val" id="rowFirst"></span></div>
      <div class="leg"><span class="name" id="t-row-redir"></span><span class="val" id="rowRedir"></span></div>
      <div class="leg"><span class="name" id="t-row-final"></span><span class="val" id="rowFinal"></span></div>
      <div class="status"><span class="code" id="stCode"></span><span class="ttl" id="stTitle"></span></div>
      <div class="explain" id="stText"></div>
      <div class="callout" id="redirBox" hidden><strong id="t-redir-h"></strong><p id="t-redir-p"></p></div>
    </div>

    <div class="group">
      <h2 id="t-h-steps"></h2>
      <div class="actions">
        <button type="button" id="btnPlay"></button>
        <button type="button" id="btnNext"></button>
        <button type="button" id="btnRestart"></button>
      </div>
      <div class="seg" id="speedSeg" dir="ltr"></div>
      <ol class="steps" id="steps"></ol>
    </div>

    <div class="legend" id="legend"></div>
    <p class="keys" id="keys"></p>
  </aside>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

      if(held.has("ArrowUp"))z+=1;if(held.has("ArrowDown"))z-=1;
      if(held.has("Equal")||held.has("NumpadAdd"))zm+=1;if(held.has("Minus")||held.has("NumpadSubtract"))zm-=1;
      if(x||z)pan(x*dt*0.55,z*dt*0.55);
      if(zm)setZoom(cam.zoom*(1-zm*dt*0.9));
      if(follow&&actObj){const k=1-Math.exp(-dt*5);target.lerp(V(actObj.position.x,Math.max(0.8,actObj.position.y),actObj.position.z),k);}
    }
    markView("overview");

    function resize(){
      const w=stage.clientWidth,h=stage.clientHeight;if(!w||!h)return;
      renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();
      const a=w/h;baseR=a>=1.6?14.5:a>=1.2?16.5:a>=0.9?20:a>=0.7?27:34;
    }
    new ResizeObserver(resize).observe(stage);resize();

    let last=performance.now(),clock=0;
    function frame(now){
      const raw=Math.min(0.05,(now-last)/1000);last=now;clock+=raw;
      tick(raw);
      edgePulse=Math.max(0,edgePulse-raw*2.5);
      const es=1+edgePulse*0.07+(reduceMotion||!state.proxy?0:Math.sin(clock*1.2)*0.012);edge.scale.set(es,es,es);
      edge.position.y=2.05+(reduceMotion||!state.proxy?0:Math.sin(clock*0.9)*0.05);
      cloudMat.emissiveIntensity=state.proxy?0.3+edgePulse*0.5:0;
      SLOTS.forEach(p=>[eSock[p],oSock[p]].forEach(s=>{if(s.pulse>0){s.pulse=Math.max(0,s.pulse-raw*2.2);const k=1+s.pulse*0.9;s.ring.scale.set(k,k,k);}else s.ring.scale.set(1,1,1);}));
      for(let i=effects.length-1;i>=0;i--){const f=effects[i];f.t+=raw*1.8;const k=1+f.t*3;f.m.scale.set(k,k,k);f.m.material.opacity=Math.max(0,0.9*(1-f.t));if(f.t>=1){scene.remove(f.m);f.m.geometry.dispose();f.m.material.dispose();effects.splice(i,1);}}
      leds.forEach((l,i)=>{l.visible=reduceMotion||Math.sin(clock*3+i*1.7)>-0.6;});
      stepFly(raw);stepNav(raw);
      if(!userMoved&&!fly&&!reduceMotion)cam.theta=VIEWS.overview.theta+Math.sin(clock*0.15)*0.06;
      placeCamera();
      renderer.render(scene,camera);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
    if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>{tracked.forEach(l=>drawLabel(l));drawScreen();});

    setLang();
    return {update,beginSeg,moveSeg,endSeg,clearSeg,resetScreen,setLang};
  }

  setStaticText();
  try{three=initThree();}
  catch(err){$("#navViews").hidden=true;$("#dpad").hidden=true;const d=document.createElement("div");d.className="nogl";d.textContent=t("nogl");$("#stage").appendChild(d);}
  applyState();
})();
</script>
